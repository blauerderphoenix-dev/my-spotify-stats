<script>
// ================= CONFIG =================
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = 'user-top-read user-read-private user-read-recently-played user-library-read';
const SP_API = 'https://api.spotify.com/v1';
const CLIENT_ID = '677e7701a9f446cab1c7aa93df3c02f7';

const LFM_KEY = '0c6c1bcb14dad55db8b608031ac09521';
const LFM_API = 'https://ws.audioscrobbler.com/2.0/';
const MB_API = 'https://musicbrainz.org/ws/2';
const MB_HEADERS = { 'User-Agent': 'SpotifyStatsPersonal/1.0' };

// ================= STATE =================
let currentRange = 'short_term';
let currentTab = 'spotify';
let currentSection = 'tracks';
let isLoading = false;

const mbTrackCache = {};
const mbArtistCache = {};

// ================= INIT =================
document.getElementById('redirect-uri-display').textContent = REDIRECT_URI;

(async function init() {
  const params = new URLSearchParams(window.location.search);

  if (params.get('code')) {
    await handleCallback(params.get('code'));
    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  const token = localStorage.getItem('sp_access_token');

  if (token) {
    showApp();
    await loadAll();
  } else {
    showLogin();
  }
})();

// ================= UI =================
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('refresh-btn').style.display = '';
  document.getElementById('logout-btn').style.display = '';
}

function showLogin() {
  document.getElementById('login-screen').style.display = '';
  document.getElementById('main-content').style.display = 'none';
}

function setStatus(msg) {
  document.getElementById('status').innerHTML =
    msg ? `<span class="loading-text">${esc(msg)}</span>` : '';
}

function showError(msg) {
  document.getElementById('error-container').innerHTML =
    `<div class="error-msg">ERR: ${esc(msg)}</div>`;
}

function clearError() {
  document.getElementById('error-container').innerHTML = '';
}

// ================= LOGIN =================
async function startLogin() {
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);

  localStorage.setItem('sp_verifier', verifier);

  const url = new URL('https://accounts.spotify.com/authorize');
  url.search = new URLSearchParams({
    response_type: 'code',
    client_id: CLIENT_ID,
    scope: SCOPES,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });

  window.location.href = url.toString();
}

async function handleCallback(code) {
  try {
    setStatus('Login...');

    const verifier = localStorage.getItem('sp_verifier');

    const resp = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    });

    const data = await resp.json();

    localStorage.setItem('sp_access_token', data.access_token);
    localStorage.setItem('sp_refresh_token', data.refresh_token);

    showApp();
    await loadAll();

  } catch (e) {
    showError(e.message);
  } finally {
    setStatus('');
  }
}

// ================= SPOTIFY API (FIXED 429) =================
async function fetchSP(endpoint) {
  let token = localStorage.getItem('sp_access_token');

  let resp = await fetch(`${SP_API}${endpoint}`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  if (resp.status === 401) {
    token = await refreshToken();
    resp = await fetch(`${SP_API}${endpoint}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
  }

  if (resp.status === 429) {
    const wait = parseInt(resp.headers.get('Retry-After')) || 3;

    setStatus(`Spotify wartet ${wait}s...`);
    await new Promise(r => setTimeout(r, (wait + 1) * 1000));

    return fetchSP(endpoint);
  }

  if (!resp.ok) {
    throw new Error(`Spotify API Error [${resp.status}]`);
  }

  return resp.json();
}

async function refreshToken() {
  const rt = localStorage.getItem('sp_refresh_token');

  const resp = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: rt,
      client_id: CLIENT_ID
    })
  });

  const data = await resp.json();
  localStorage.setItem('sp_access_token', data.access_token);

  return data.access_token;
}

// ================= LOAD =================
async function loadAll() {
  if (isLoading) return;
  isLoading = true;

  try {
    clearError();

    setStatus('Profil...');
    const me = await fetchSP('/me');

    document.getElementById('user-info').textContent =
      `${me.display_name || me.id}`;

    setStatus('Tracks...');
    const tracks = await fetchSP(`/me/top/tracks?limit=20&time_range=${currentRange}`);

    setStatus('Artists...');
    const artists = await fetchSP(`/me/top/artists?limit=20&time_range=${currentRange}`);

    renderTracks(tracks.items);
    renderArtists(artists.items);

  } catch (e) {
    showError(e.message);
  }

  setStatus('');
  isLoading = false;
}

// ================= RENDER =================
function renderTracks(items) {
  const el = document.getElementById('tracks-list');

  el.innerHTML = items.map((t, i) => `
    <li class="track-item">
      <span class="rank">#${i+1}</span>
      <div>
        <div>${esc(t.name)}</div>
        <div style="color:#666">${esc(t.artists.map(a=>a.name).join(', '))}</div>
      </div>
    </li>
  `).join('');
}

function renderArtists(items) {
  const el = document.getElementById('artists-list');

  el.innerHTML = items.map((a, i) => `
    <li class="artist-item">
      <span class="rank">#${i+1}</span>
      <div>
        <div>${esc(a.name)}</div>
      </div>
    </li>
  `).join('');
}

// ================= HELPERS =================
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ================= BUTTONS =================
function logout() {
  localStorage.clear();
  location.reload();
}

function onRefresh() {
  loadAll();
}

function switchTab(tab) {
  currentTab = tab;
}
</script>
